name: Scrape card offers & deploy Pages

on:
  schedule:
    - cron: "43 */4 * * *"   # every 4 hours (GitHub may start scheduled runs late)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Logic tests
        run: python tests/test_cards.py
      - name: Scrape
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python card_scout.py | tee scrape.log
      - name: Page smoke test (every tab against the fresh data)
        run: node tests/smoke.js site/index.html
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Card Scout run"
            echo '```'
            sed -n '/^Done in/,$p' scrape.log | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
